name: deploy production (vercel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

# Mismo equipo de Vercel que MiTiendita; proyecto propio "mirestaurante".
env:
  VERCEL_SCOPE: team_zTGwYKWZiYNP6cXzPReKRjpF
  VERCEL_PROJECT: mirestaurante

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Crea el proyecto en Vercel la primera vez y lo enlaza
      - name: Link Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://mirestaurante.vercel.app' }}
        run: |
          vercel deploy --prod --yes --scope "$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}" \
            -e DATABASE_URI="$DATABASE_URI" \
            -e DATABASE_NAME=mirestaurante \
            -e SECRET_KEY="$SECRET_KEY" \
            -e APP_URL="$APP_URL" \
            -e API_PUBLIC_URL="$APP_URL/api" \
            -e NODE_ENV=production
