name: deploy production (vercel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

# Proyecto propio "mirestaurante" dentro de tu equipo de Vercel.
# Para usar otro equipo, define la variable del repo VERCEL_SCOPE.
env:
  VERCEL_PROJECT: mirestaurante
  VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'team_zTGwYKWZiYNP6cXzPReKRjpF' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Crea el proyecto "mirestaurante" la primera vez (o reusa el existente) y lo enlaza
      # sin "vercel link", que falla con tokens limitados a un equipo.
      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          api="https://api.vercel.com"
          auth="Authorization: Bearer $VERCEL_TOKEN"
          code=$(curl -sS -o project.json -w '%{http_code}' -H "$auth" "$api/v9/projects/$VERCEL_PROJECT?teamId=$VERCEL_SCOPE")
          if [ "$code" = "404" ]; then
            code=$(curl -sS -o project.json -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$VERCEL_PROJECT\"}" "$api/v10/projects?teamId=$VERCEL_SCOPE")
          fi
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "Vercel API respondió $code:"; cat project.json; exit 1
          fi
          project_id=$(jq -r .id project.json)
          rm project.json
          # Sitio público: sin pantalla de login de Vercel en producción
          curl -sS -o /dev/null -w 'ssoProtection off → %{http_code}\n' -X PATCH -H "$auth" -H 'Content-Type: application/json' \
            -d '{"ssoProtection":null}' "$api/v9/projects/$project_id?teamId=$VERCEL_SCOPE"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_SCOPE" "$project_id" > .vercel/project.json
          echo "Proyecto $VERCEL_PROJECT → $project_id"

      - name: Deploy to production
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://mirestaurante-ten.vercel.app' }}
        run: |
          vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" \
            -e DATABASE_URI="$DATABASE_URI" \
            -e DATABASE_NAME=mirestaurante \
            -e SECRET_KEY="$SECRET_KEY" \
            -e APP_URL="$APP_URL" \
            -e API_PUBLIC_URL="$APP_URL/api" \
            -e NODE_ENV=production
